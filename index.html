<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radian Pixel Apps</title>
<meta name="description" content="Radian Pixel Apps SRL — makers of Spider Solitaire – Classic for iPhone and iPad.">
<style>
  :root {
    --felt:     #1F3D2B;
    --charcoal: #2A2A28;
    --card:     #F6F3EC;
    --ink:      #EDEAE1;
    --ink-dim:  #B9C4B6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--felt);
    background-image: radial-gradient(ellipse at 50% 35%, rgba(255,255,255,.055), transparent 60%);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main { text-align: center; max-width: 34rem; }
  .mark {
    width: 72px; height: 96px;
    margin: 0 auto 28px;
    background: var(--card);
    border-radius: 8px;
    box-shadow: 0 6px 18px rgba(0,0,0,.35), 0 1px 0 rgba(255,255,255,.15) inset;
    display: flex; align-items: center; justify-content: center;
    font-size: 44px; line-height: 1;
    color: var(--charcoal);
    user-select: none;
  }
  h1 {
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-size: clamp(1.6rem, 5vw, 2.2rem);
    font-weight: 600;
    letter-spacing: .01em;
    color: var(--card);
  }
  .tag {
    margin-top: 10px;
    font-size: .95rem;
    color: var(--ink-dim);
  }
  .apps { margin-top: 40px; }
  .app-card {
    display: inline-block;
    background: rgba(0,0,0,.22);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 12px;
    padding: 18px 26px;
    text-decoration: none;
    color: var(--ink);
    transition: background .15s ease;
  }
  .app-card:hover, .app-card:focus-visible { background: rgba(0,0,0,.34); }
  .app-card:focus-visible { outline: 2px solid var(--card); outline-offset: 3px; }
  .app-name {
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-size: 1.15rem;
    color: var(--card);
  }
  .app-sub { margin-top: 4px; font-size: .85rem; color: var(--ink-dim); }
  .app-cta { margin-top: 12px; font-size: .85rem; letter-spacing: .04em; text-transform: uppercase; color: var(--ink); }
  footer {
    margin-top: 56px;
    font-size: .8rem;
    color: var(--ink-dim);
  }
  footer a { color: var(--ink-dim); text-decoration: underline; text-underline-offset: 2px; }
  footer a:hover, footer a:focus-visible { color: var(--card); }
  footer a:focus-visible { outline: 2px solid var(--card); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">&#9824;</div>
  <h1>Radian Pixel Apps</h1>
  <p class="tag">Small studio. Calm, polished card games.</p>

  <div class="apps">
    <a class="app-card" href="https://apps.apple.com/app/spider-solitaire-classic/id6792047420">
      <div class="app-name">Spider Solitaire &ndash; Classic</div>
      <div class="app-sub">Relaxing, offline patience &middot; iPhone &amp; iPad</div>
      <div class="app-cta">Get it on the App Store &rarr;</div>
    </a>
  </div>

  <footer>
    &copy; 2026 Radian Pixel Apps SRL &middot; <a href="/privacy-policy.html">Privacy Policy</a>
  </footer>
</main>
</body>
</html>
